[package]
name = "staragent-desktop"
version = "0.1.3-dev.0"
description = "Native desktop gateway for StarAgent Launcher and Hub"
authors = ["SiriusNEO"]
edition = "2021"
license = "MIT"
repository = "https://github.com/SiriusNEO/StarAgent"

[lib]
name = "staragent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
