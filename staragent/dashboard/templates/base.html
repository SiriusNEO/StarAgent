<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}StarAgent{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}?v={{ static_version('favicon.svg') }}" type="image/svg+xml">
    <script>
      (() => {
        const settings = {
          storageKey: "staragent.theme",
          legacyKey: "staragent.theme.accent",
          backgroundModeKey: "staragent.theme.backgroundMode",
          backgroundImageKey: "staragent.theme.backgroundImage",
          surfaceModeKey: "staragent.theme.surfaceMode",
          legacyMap: {
            "#660874": "tsinghua",
            "#315efb": "blue",
            "#167a46": "green",
            "#b45309": "amber",
            "#b42318": "red",
          },
          themes: ["tsinghua", "minimal", "sakura", "miku", "cyber", "blue", "green", "amber", "red"],
          backgroundModes: ["solid", "tint", "gradient", "image"],
          surfaceModes: ["solid", "glass", "clear-glass"],
        };
        window.StarAgentThemeSettings = settings;
        const {storageKey, legacyKey, backgroundModeKey, backgroundImageKey, surfaceModeKey, legacyMap} = settings;
        const knownThemes = new Set(settings.themes);
        const knownBackgroundModes = new Set(settings.backgroundModes);
        const saved = localStorage.getItem(storageKey) || legacyMap[localStorage.getItem(legacyKey)] || "tsinghua";
        const rawBackgroundMode = localStorage.getItem(backgroundModeKey) || "solid";
        const savedBackgroundMode = rawBackgroundMode === "image" || localStorage.getItem(backgroundImageKey) === "on" ? "image" : rawBackgroundMode;
        const savedSurfaceMode = localStorage.getItem(surfaceModeKey) || "solid";
        document.documentElement.dataset.theme = knownThemes.has(saved) ? saved : "tsinghua";
        document.documentElement.dataset.bgMode = knownBackgroundModes.has(savedBackgroundMode) ? savedBackgroundMode : "solid";
        document.documentElement.dataset.surfaceMode = settings.surfaceModes.includes(savedSurfaceMode) ? savedSurfaceMode : "solid";
        window.StarAgentAfterPaint = (callback, timeout = 1000) => {
          const runWhenIdle = () => {
            if ("requestIdleCallback" in window) {
              window.requestIdleCallback(callback, {timeout});
            } else {
              setTimeout(callback, 0);
            }
          };
          if (document.hidden) {
            runWhenIdle();
            return;
          }
          requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(runWhenIdle, 120)));
        };
      })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}?v={{ static_version('styles.css') }}">
    {% block head_extra %}{% endblock %}
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand-lockup">
          <div class="theme-menu-wrap">
            <button type="button" class="brand-theme-button" aria-expanded="false" aria-label="Change theme" title="Change theme">
              <span class="theme-swatch" aria-hidden="true"></span>
              <span class="brand">StarAgent</span>
            </button>
            <div class="theme-menu" hidden>
              <div class="theme-menu-section">
                <div class="theme-menu-title">Theme Color</div>
                <div class="theme-option-grid">
                  <button type="button" class="theme-option" data-theme="tsinghua" aria-label="Purple theme" style="--theme-color: #660874; --theme-color-2: #dfc7e5;"><span></span></button>
                  <button type="button" class="theme-option" data-theme="minimal" aria-label="Black theme" style="--theme-color: #24211f; --theme-color-2: #ebe7df;"><span></span></button>
                  <button type="button" class="theme-option" data-theme="sakura" aria-label="Pink theme" style="--theme-color: #d9467f; --theme-color-2: #ffd6e5;"><span></span></button>
                  <button type="button" class="theme-option" data-theme="miku" aria-label="Teal theme" style="--theme-color: #00a6b4; --theme-color-2: #9bf6e8;"><span></span></button>
                  <button type="button" class="theme-option" data-theme="cyber" aria-label="Violet theme" style="--theme-color: #5f3dc4; --theme-color-2: #74c0fc;"><span></span></button>
                  <button type="button" class="theme-option" data-theme="blue" aria-label="Blue theme" style="--theme-color: #315efb; --theme-color-2: #c9d7ff;"><span></span></button>
                  <button type="button" class="theme-option" data-theme="green" aria-label="Green theme" style="--theme-color: #167a46; --theme-color-2: #badccb;"><span></span></button>
                </div>
              </div>
              <div class="theme-menu-section">
                <div class="theme-menu-title">Background</div>
                <div class="background-mode-group" role="group" aria-label="Background mode">
                  <button type="button" data-bg-mode="solid">White</button>
                  <button type="button" data-bg-mode="tint">Light</button>
                  <button type="button" data-bg-mode="gradient">Gradient</button>
                  <button type="button" data-bg-mode="image">Image</button>
                </div>
                <div class="theme-background-actions">
                  <label class="theme-upload-button">
                    Upload image
                    <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
                  </label>
                  <button type="button" class="theme-clear-background">Clear</button>
                </div>
                <div class="theme-background-library" aria-label="Background library" hidden></div>
                <div class="theme-upload-status" aria-live="polite"></div>
              </div>
              <div class="theme-menu-section">
                <div class="theme-menu-title">Surface</div>
                <div class="surface-mode-group" role="group" aria-label="Surface mode">
                  <button type="button" data-surface-mode="solid">Solid</button>
                  <button type="button" data-surface-mode="glass">Glass</button>
                  <button type="button" data-surface-mode="clear-glass">Clear</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <nav class="app-nav" aria-label="Primary navigation">
          <a class="{{ 'is-active' if request.url.path.startswith('/sessions') or request.url.path.startswith('/nodes/') else '' }}" href="/sessions">Sessions</a>
          <a class="{{ 'is-active' if request.url.path.startswith('/nodes') and not request.url.path.startswith('/nodes/') else '' }}" href="/nodes">Nodes</a>
          <a class="{{ 'is-active' if request.url.path.startswith('/logs') else '' }}" href="/logs">Logs</a>
          <a class="{{ 'is-active' if request.url.path.startswith('/lark') else '' }}" href="/lark">Lark</a>
        </nav>
      </div>
      <nav class="utility-nav">
        <form class="logout-form" method="post" action="/logout">
          <button type="submit">Logout</button>
        </form>
      </nav>
    </header>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', path='base.js') }}?v={{ static_version('base.js') }}"></script>
  </body>
</html>
