name: Desktop

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main, dev]
    paths:
      - "desktop/**"
      - "staragent/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "staragent/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ${{ matrix.os }}
    env:
      STARAGENT_BUILD_COMMIT: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            artifact: staragent-linux-x64
            args: ""
            rust_targets: ""
            target_triple: x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-latest
            artifact: staragent-windows-x64
            args: ""
            rust_targets: ""
            target_triple: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-15
            artifact: staragent-macos-arm64
            args: ""
            rust_targets: ""
            target_triple: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-15-intel
            artifact: staragent-macos-x64
            args: ""
            rust_targets: ""
            target_triple: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Prepare unique Nightly version
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          python desktop/scripts/prepare_nightly_version.py \
            --run-number "$GITHUB_RUN_NUMBER" \
            --write

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Build bundled desktop runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          python desktop/scripts/build_runtime.py --target-triple "${{ matrix.target_triple }}"

      - name: Prepare Windows ConPTY smoke test
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python desktop/scripts/smoke_windows_conpty.py

      - name: Smoke test bundled Windows runtime
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $runtime = Start-Process -FilePath "desktop/src-tauri/binaries/staragent-runtime-x86_64-pc-windows-msvc.exe" -ArgumentList "--host", "127.0.0.1", "--port", "18765", "--mode", "launcher" -PassThru
          $sessionCreated = $false
          try {
            $ready = $false
            foreach ($attempt in 1..60) {
              try {
                $identity = Invoke-RestMethod "http://127.0.0.1:18765/api/runtime" -TimeoutSec 1
                if ($identity.status -eq "ok" -and $identity.session_backend -eq "conpty" -and $identity.desktop_bundled) {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "Bundled runtime did not become ready." }

            $body = @{
              node = "local"
              name = "windows-native-smoke"
              cwd = $env:RUNNER_TEMP
              command = "Write-Output packaged-conpty-ready"
            } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18765/api/workers" -ContentType "application/json" -Body $body | Out-Null
            $sessionCreated = $true

            $terminalReady = $false
            foreach ($attempt in 1..40) {
              $capture = Invoke-RestMethod "http://127.0.0.1:18765/api/sessions/windows-native-smoke/output?lines=80" -TimeoutSec 1
              if ($capture.output -match "packaged-conpty-ready") {
                $terminalReady = $true
                break
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $terminalReady) { throw "Bundled runtime did not produce ConPTY Session output." }
          } finally {
            if ($sessionCreated) {
              try {
                Invoke-RestMethod -Method Delete "http://127.0.0.1:18765/api/nodes/local/sessions/windows-native-smoke" -TimeoutSec 2 | Out-Null
              } catch {}
            }
            taskkill /PID $runtime.Id /T /F 2>$null | Out-Null
          }

      - name: Smoke test bundled POSIX runtime
        if: runner.os != 'Windows'
        run: >-
          python desktop/scripts/smoke_bundled_runtime.py
          "desktop/src-tauri/binaries/staragent-runtime-${{ matrix.target_triple }}"
          --backend pty

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Check desktop frontend
        working-directory: desktop
        run: npm run check

      - name: Verify release version
        if: github.event_name == 'release'
        run: python desktop/scripts/check_release_version.py "${{ github.event.release.tag_name }}"

      - name: Test desktop core
        if: matrix.os == 'ubuntu-22.04'
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Select updater artifact mode
        id: updater-artifacts
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          config="--config src-tauri/tauri.sidecar.conf.json"
          if [[ "$EVENT_NAME" == "release" ]]; then
            config="--config src-tauri/tauri.updater.conf.json"
          fi
          if [[ "$EVENT_NAME" == "push" && "$GIT_REF" == "refs/heads/dev" ]]; then
            config="--config src-tauri/tauri.updater.conf.json"
          fi
          echo "config=$config" >> "$GITHUB_OUTPUT"

      - name: Build native bundles
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }} ${{ steps.updater-artifacts.outputs.config }}

      - name: Label Apple Silicon macOS artifacts
        if: matrix.target_triple == 'aarch64-apple-darwin'
        run: python desktop/scripts/label_macos_artifacts.py desktop/src-tauri/target --arch aarch64

      - name: Label Intel macOS artifacts
        if: matrix.target_triple == 'x86_64-apple-darwin'
        run: python desktop/scripts/label_macos_artifacts.py desktop/src-tauri/target --arch x64

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            desktop/src-tauri/target/**/release/bundle/**/*.deb
            desktop/src-tauri/target/**/release/bundle/**/*.rpm
            desktop/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/**/release/bundle/**/*-setup.exe
            desktop/src-tauri/target/**/release/bundle/**/*.msi
            desktop/src-tauri/target/**/release/bundle/**/*.sig

  publish:
    name: Attach installers to release
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: staragent-*
          path: release-assets
          merge-multiple: false

      - name: Build signed updater manifest
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          python desktop/scripts/build_updater_manifest.py \
            --asset-dir release-assets \
            --output release-assets/latest.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --published-at "$RELEASE_PUBLISHED_AT" \
            --commit "$GITHUB_SHA"

      - name: Upload installer assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          mapfile -d '' assets < <(
            find release-assets -type f \( \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.rpm' -o \
              -name '*.dmg' -o \
              -name '*.app.tar.gz' -o \
              -name '*-setup.exe' -o \
              -name '*.msi' -o \
              -name '*.sig' -o \
              -name 'latest.json' \
            \) -print0
          )
          if (( ${#assets[@]} == 0 )); then
            echo "No installer assets were produced." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish-nightly:
    name: Publish rolling Nightly update
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: staragent-*
          path: release-assets
          merge-multiple: false

      - name: Prepare Nightly metadata
        id: nightly
        shell: bash
        run: |
          version="$(python desktop/scripts/prepare_nightly_version.py \
            --run-number "$GITHUB_RUN_NUMBER")"
          published_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"

      - name: Give macOS updaters unique architecture names
        env:
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}
        shell: bash
        run: |
          mapfile -d '' archives < <(find release-assets -type f -name '*.app.tar.gz' -print0)
          if (( ${#archives[@]} != 2 )); then
            echo "Expected two macOS updater archives; found ${#archives[@]}." >&2
            exit 1
          fi
          for source in "${archives[@]}"; do
            signature="${source}.sig"
            if [[ ! -f "$signature" ]]; then
              echo "The macOS updater signature is missing for $source." >&2
              exit 1
            fi
            case "${source,,}" in
              *aarch64*|*arm64*) arch="aarch64" ;;
              *x86_64*|*x64*|*amd64*) arch="x64" ;;
              *) echo "Could not identify the macOS architecture for $source." >&2; exit 1 ;;
            esac
            destination="$(dirname "$source")/StarAgent_${NIGHTLY_VERSION}_${arch}.app.tar.gz"
            mv "$source" "$destination"
            mv "$signature" "${destination}.sig"
          done

      - name: Build signed Nightly updater manifest
        env:
          RELEASE_NOTES: Nightly build from dev commit ${{ github.sha }}.
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}
          NIGHTLY_PUBLISHED_AT: ${{ steps.nightly.outputs.published_at }}
        run: |
          python desktop/scripts/build_updater_manifest.py \
            --asset-dir release-assets \
            --output release-assets/latest.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag nightly \
            --version "$NIGHTLY_VERSION" \
            --published-at "$NIGHTLY_PUBLISHED_AT" \
            --commit "$GITHUB_SHA"

      - name: Publish Nightly assets atomically
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}
        shell: bash
        run: |
          nightly_tag="nightly"
          notes="Automated ${NIGHTLY_VERSION} build from dev commit ${GITHUB_SHA}."
          if ! gh release view "$nightly_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$nightly_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "StarAgent Nightly" \
              --notes "$notes" \
              --prerelease
          fi

          previous_version=""
          previous_manifest_dir="$RUNNER_TEMP/staragent-previous-manifest"
          mkdir -p "$previous_manifest_dir"
          if gh release download "$nightly_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$previous_manifest_dir" 2>/dev/null; then
            previous_version="$(jq -r '.version // empty' "$previous_manifest_dir/latest.json")"
            if [[ ! "$previous_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
              previous_version=""
            fi
          fi

          mapfile -d '' assets < <(
            find release-assets -type f \( \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.rpm' -o \
              -name '*.dmg' -o \
              -name '*.app.tar.gz' -o \
              -name '*-setup.exe' -o \
              -name '*.msi' -o \
              -name '*.sig' \
            \) -print0
          )
          if (( ${#assets[@]} == 0 )); then
            echo "No Nightly installer assets were produced." >&2
            exit 1
          fi

          gh release upload "$nightly_tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release upload "$nightly_tag" release-assets/latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/git/refs/tags/$nightly_tag" \
            -f sha="$GITHUB_SHA" \
            -F force=true >/dev/null
          gh release edit "$nightly_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "StarAgent Nightly" \
            --notes "$notes" \
            --prerelease

          declare -A keep=()
          for asset in "${assets[@]}" release-assets/latest.json; do
            keep["$(basename "$asset")"]=1
          done
          while IFS= read -r name; do
            if [[ -n "$previous_version" && "$name" == *"$previous_version"* ]]; then
              continue
            fi
            if [[ -n "$name" && -z "${keep[$name]+present}" ]]; then
              gh release delete-asset "$nightly_tag" "$name" \
                --repo "$GITHUB_REPOSITORY" \
                --yes
            fi
          done < <(
            gh release view "$nightly_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )
